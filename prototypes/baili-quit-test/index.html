<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>为什么我总想辞职？｜白梨小测</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#25231f;--muted:#7d776e;--line:#e6e0d7;--soft:#efeae2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 56px}.hero{padding:38px 4px 20px}.brand{font-size:13px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px}h1{font-size:34px;line-height:1.25;margin:0 0 14px}.hero p{margin:0;color:var(--muted);line-height:1.75}.chips{margin-top:16px}.chip{display:inline-block;margin-right:7px;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.04)}.progress{height:8px;border-radius:99px;background:#ebe6df;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:#28241f;width:0;transition:.2s}.meta{font-size:13px;color:var(--muted);margin-bottom:10px}.title{font-size:21px;font-weight:650;line-height:1.55;margin-bottom:6px}.sub{font-size:14px;color:var(--muted);margin-bottom:18px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:15px 16px;border-radius:14px;margin:9px 0;font-size:15px;line-height:1.55;cursor:pointer}.opt:hover{background:#faf8f4}.opt.sel{border-color:#26231f;background:#f1ede6}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer}.primary{background:#28241f;color:white;flex:1}.secondary{background:#eee9e1;flex:1}.btn:disabled{opacity:.35;cursor:not-allowed}.start{margin-top:20px;width:100%;background:#28241f;color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px}.hidden{display:none}.score{font-size:44px;font-weight:750;margin:8px 0}.result-title{font-size:24px;font-weight:700;line-height:1.4;margin-bottom:10px}.summary{color:#5f5a53;line-height:1.75}.rank{padding:18px 0;border-top:1px solid var(--line)}.rankhead{display:flex;justify-content:space-between;gap:12px;font-weight:650}.meter{height:7px;background:#ebe6df;border-radius:99px;overflow:hidden;margin:10px 0}.meter>div{height:100%;background:#28241f}.rank p,.note{font-size:14px;color:#6b655d;line-height:1.7}.insight{background:#f2eee7;border-radius:15px;padding:18px;line-height:1.75;margin-top:16px}.footer{font-size:12px;color:#8a847c;margin-top:16px;line-height:1.6}
</style>
</head>
<body><div class="wrap">
<section id="intro" class="hero"><div class="brand">白梨小测 · MVP</div><h1>为什么我总想辞职？</h1><p>你到底是该走，还是换到哪里都会想走？<br>15 道题，约 3 分钟，看看你的离职冲动主要来自哪里。</p><div class="chips"><span class="chip">15题</span><span class="chip">约3分钟</span><span class="chip">即时结果</span></div><button class="start" type="button">开始测试</button></section>
<section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div id="meta" class="meta"></div><div id="title" class="title"></div><div id="sub" class="sub"></div><div id="options"></div><div class="actions"><button id="prev" class="btn secondary" type="button">上一题</button><button id="next" class="btn primary" type="button" disabled>下一题</button></div></section>
<section id="result" class="card hidden"></section>
</div>
<script>
const Q=[
{id:1,t:'到目前为止，你有过几段正式的全职工作？',type:'single',o:[['1段',{}],['2段',{}],['3～4段',{}],['5段及以上',{}]]},
{id:2,t:'回想这些工作，你有多少份都曾经非常认真地想过辞职？',type:'single',o:[['基本没有',{ESC:0}],['只有现在这一份',{ESC:1}],['有一半左右',{ESC:2}],['几乎每一份都会',{ESC:4}]]},
{id:3,t:'一份工作开始以后，你通常什么时候最容易出现明显的离职念头？',type:'single',o:[['刚入职不久，发现现实和想象不一样',{FIT:2,ENV:1}],['1～3个月，开始真正独立承担工作以后',{CMP:2,EVA:1}],['3～6个月，熟悉以后发现问题越来越多',{ENV:2,MEA:1}],['做了一年以上，看不到成长或未来以后',{MEA:2,FIT:1}],['没有固定时间，通常是发生某件事以后',{ENV:1,ESC:1}]]},
{id:4,t:'下面哪些情况最容易让你突然冒出“我不想干了”的念头？',s:'最多选 2 项',type:'multi',max:2,o:[['工作突然变得很乱，需求、方向一直变化',{ENV:3,AUT:1}],['遇到不会处理的问题，发现自己搞不定',{CMP:3,EVA:1}],['经常加班，下班后、周末也被工作打扰',{BND:3}],['每天做很多事，却越来越不知道意义在哪里',{MEA:3}],['被领导批评、否定，或者明显感觉对方不满意',{EVA:3}],['一直被催、被管、没有自己决定事情的空间',{AUT:3}],['发现这类工作本身就不是自己想做的',{FIT:3}],['工资、晋升、发展明显不值得继续投入',{PAY:3}]]},
{id:5,t:'你花了一整天做完方案，领导只回复：“方向不太对，再想想。”你第一反应最接近：',type:'single',o:[['很紧张，开始想是不是自己能力不行',{EVA:3,CMP:2}],['很烦，因为根本没告诉我哪里不对',{ENV:2,AUT:1}],['觉得一天白干了，这种工作特别没意义',{MEA:3}],['想赶紧问清楚标准，再重新处理',{ENV:1}],['如果这种事经常发生，我会马上开始想离职',{ESC:3,ENV:1}]]},
{id:6,t:'工作突然增加很多，但你知道目标是什么，也能自己决定怎么完成。你会：',type:'single',o:[['虽然累，但只要能做出结果就可以接受',{}],['还是不能接受，我不希望工作长期侵占生活',{BND:3}],['只要这是我自己决定怎么做的，反而没那么难受',{AUT:3}],['我最担心的还是最后结果不好，被认为能力不行',{EVA:3,CMP:2}],['不管怎样，只要长期这么忙我都会想走',{BND:2,ESC:2}]]},
{id:7,t:'领导临时要求你把已经做好的东西全部改掉。哪一点最让你难受？',type:'single',o:[['为什么之前不说清楚',{ENV:3}],['我之前是不是理解能力太差',{CMP:2,EVA:2}],['已经投入的时间全部浪费了',{MEA:2}],['我讨厌别人随时改变我的安排',{AUT:3}],['改没关系，只要理由合理、目标清楚',{ENV:1}]]},
{id:8,t:'你遇到一个自己完全不知道怎么处理的问题时，最接近哪种状态？',type:'single',o:[['先查资料、找人、拆问题，试着解决',{}],['很焦虑，脑子里一直想领导会怎么看我',{EVA:3}],['会拖着，不太想碰它',{CMP:2,ESC:1}],['会开始怀疑自己是不是根本不适合这份工作',{FIT:2,ESC:3,CMP:1}],['如果有人告诉我方法，我其实马上就能继续做',{CMP:3}]]},
{id:9,t:'假设现在这份工作的工资突然上涨 30%，其他什么都不变，你还会想辞职吗？',type:'single',o:[['基本不会了',{PAY:4}],['会少很多，但还是偶尔想',{PAY:2}],['差不多，问题根本不是钱',{}],['甚至还是非常想走',{FIT:1,ENV:1}]]},
{id:10,t:'如果工作内容不变，但以后目标明确、领导很少临时改需求、下班不找你、你自己决定怎么完成，你的离职念头会怎样？',type:'single',o:[['基本消失',{ENV:3,BND:2,AUT:2}],['明显减少',{ENV:2,BND:1,AUT:1}],['有一些改善，但还是想走',{FIT:1,MEA:1}],['基本没变化',{FIT:3,MEA:2}]]},
{id:11,t:'如果给你一份完全一样的工作，但换成另一家公司、另一位领导，你愿意继续做吗？',type:'single',o:[['很愿意',{ENV:3}],['可以试试',{ENV:2}],['犹豫',{FIT:1,ENV:1}],['完全不想',{FIT:3}]]},
{id:12,t:'假设没有 KPI、没有领导评价，也不用向任何人证明自己，你还愿意做现在这些工作内容吗？',type:'single',o:[['会，我其实对事情本身有兴趣',{EVA:1}],['部分会，有些内容我还是喜欢的',{FIT:1}],['大部分不会',{FIT:2}],['完全不会',{FIT:4}]]},
{id:13,t:'下面哪一种变化，最能让你愿意继续留半年？',type:'single',o:[['工作时间明显减少，下班彻底属于自己',{BND:4}],['有人带我，告诉我复杂问题应该怎么处理',{CMP:4}],['领导明确告诉我标准，而且减少反复修改',{ENV:4}],['给我更多自主权，不要一直催和管',{AUT:4}],['让我做更有价值、能看见结果的项目',{MEA:4}],['涨薪或明确晋升机会',{PAY:4}],['换工作内容，这些事情我确实不想再做',{FIT:4}]]},
{id:14,t:'这种让你想辞职的感觉，在过去的工作里出现过类似版本吗？',type:'single',o:[['基本没有，这是第一次',{ESC:0}],['偶尔有，但原因不同',{ESC:1}],['出现过两三次，而且原因很像',{ESC:3}],['几乎每份工作最后都会变成这样',{ESC:5}]]},
{id:15,t:'假设明天真的有一份新工作摆在你面前：工资差不多，工作时间也差不多，而且你并不知道新公司真实情况。你此刻最真实的想法是什么？',type:'single',o:[['只要能离开现在这里，我就想去',{ESC:4}],['我会很心动，因为我觉得换一个环境可能就好了',{ESC:2,ENV:1}],['我会认真比较两边，不会仅仅因为现在难受就走',{}],['我其实不知道下一份会不会一样，这也是我一直不敢走的原因',{ESC:2,EVA:1}],['我现在甚至不想找新工作，只想先彻底休息一段时间',{BND:2,ENV:1}]]}
];
const N={ENV:'环境失控',BND:'边界侵占',AUT:'自主权不足',CMP:'胜任感受损',EVA:'评价压力',MEA:'意义感缺失',FIT:'工作内容不匹配',ESC:'逃离模式',PAY:'回报不匹配'};
const D={ENV:'你对标准模糊、频繁变动、管理混乱和低可预测性较敏感。',BND:'工作一旦持续侵占下班、周末和私人生活，你的离职冲动会明显上升。',AUT:'你更需要对节奏、方法和安排拥有一定决定权，频繁被催、被管会快速消耗你。',CMP:'当你不知道怎么推进复杂任务时，胜任感下降会直接放大离职冲动。',EVA:'你会投入很多精力想象领导或同事如何评价自己，这让工作压力被二次放大。',MEA:'当工作长期碎片化、重复、看不到结果和积累时，你会越来越难坚持。',FIT:'你对当前这类工作本身的兴趣和匹配度可能已经偏低，换环境未必能根治。',ESC:'当压力超过阈值时，你较容易用“换一份工作”来恢复控制感，需要留意是否跨工作重复。',PAY:'薪酬、晋升或回报与投入不匹配，是你产生离职冲动的重要现实因素。'};
const MAX={ENV:19,BND:11,AUT:14,CMP:16,EVA:16,MEA:14,FIT:20,ESC:20,PAY:11};
let i=0,A={};
const els={intro:document.getElementById('intro'),quiz:document.getElementById('quiz'),result:document.getElementById('result'),bar:document.getElementById('bar'),meta:document.getElementById('meta'),qTitle:document.getElementById('title'),sub:document.getElementById('sub'),options:document.getElementById('options'),prevBtn:document.getElementById('prev'),nextBtn:document.getElementById('next')};
const startBtn=document.querySelector('.start');
function startTest(){els.intro.classList.add('hidden');els.quiz.classList.remove('hidden');render()}
function render(){const q=Q[i];els.bar.style.width=(i/Q.length*100)+'%';els.meta.textContent=`第 ${i+1} / ${Q.length} 题`;els.qTitle.textContent=q.t;els.sub.textContent=q.s||'';els.sub.style.display=q.s?'block':'none';els.options.innerHTML='';q.o.forEach((x,oi)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=x[0];const a=A[q.id];if(q.type==='single'&&a===oi)b.classList.add('sel');if(q.type==='multi'&&Array.isArray(a)&&a.includes(oi))b.classList.add('sel');b.addEventListener('click',()=>pick(q,oi));els.options.appendChild(b)});els.prevBtn.style.visibility=i===0?'hidden':'visible';const a=A[q.id];els.nextBtn.disabled=q.type==='single'?!Number.isInteger(a):!(Array.isArray(a)&&a.length);els.nextBtn.textContent=i===Q.length-1?'查看结果':'下一题'}
function pick(q,oi){if(q.type==='single'){A[q.id]=oi}else{let a=Array.isArray(A[q.id])?[...A[q.id]]:[];if(a.includes(oi))a=a.filter(x=>x!==oi);else if(a.length<q.max)a.push(oi);A[q.id]=a}render()}
function nextQ(){if(i<Q.length-1){i++;render()}else showResult()}
function prevQ(){if(i>0){i--;render()}}
function scores(){const s={ENV:0,BND:0,AUT:0,CMP:0,EVA:0,MEA:0,FIT:0,ESC:0,PAY:0};Q.forEach(q=>{const a=A[q.id],arr=q.type==='single'?[a]:a;(arr||[]).forEach(oi=>{if(!Number.isInteger(oi)||!q.o[oi])return;Object.entries(q.o[oi][1]||{}).forEach(([k,v])=>{s[k]+=v})})});const n={};Object.keys(s).forEach(k=>{n[k]=Math.min(100,Math.round(s[k]/MAX[k]*100))});return n}
function showResult(){const n=scores(),r=Object.entries(n).sort((a,b)=>b[1]-a[1]),top=r.slice(0,3);const ext=Math.round((n.ENV+n.BND+n.AUT+n.PAY)/4),inn=Math.round((n.CMP+n.EVA+n.FIT+n.ESC+n.MEA)/5);let bal='';if(ext>inn+12)bal='这次更偏外部环境问题：组织方式、边界或自主权对你影响更大。';else if(inn>ext+12)bal='这次更偏内部反应模式：胜任感、评价压力、工作匹配或逃离倾向更突出。';else bal='你的情况更像“环境 × 个人反应”共同作用，单纯换公司或单纯要求自己适应都可能不够。';let pat='';if(n.ESC>=65)pat='你的离职冲动有较明显的“重复模式”特征：压力一上来，换工作会很快进入你的解题路径。';else if(n.ESC>=40)pat='你有一定的逃离倾向，但还不能简单判断为“每份工作都会这样”。';else pat='目前看，你的离职念头更像由具体问题触发，而不是稳定的“逢工作必想走”模式。';const overall=Math.round(top[0][1]*.5+top[1][1]*.3+top[2][1]*.2);els.quiz.classList.add('hidden');els.result.classList.remove('hidden');const ranks=top.map((x,j)=>`<div class="rank"><div class="rankhead"><span>${j===0?'主因':j===1?'次因':'放大器'} · ${N[x[0]]}</span><span>${x[1]}/100</span></div><div class="meter"><div style="width:${x[1]}%"></div></div><p>${D[x[0]]}</p></div>`).join('');els.result.innerHTML=`<div class="meta">你的测试结果</div><div class="score">${overall}</div><div class="result-title">你的离职冲动主要来自：${N[top[0][0]]}</div><div class="summary">${bal}</div>${ranks}<div class="insight"><b>模式判断</b><br>${pat}<br><br><b>这份结果在回答什么？</b><br>它不是替你判断“该不该辞职”，而是在解释：什么因素最容易把你推到“想离开”的位置。真正值得继续验证的是，换一个环境后，这些触发器是否仍然重复出现。</div><div class="footer">当前为白梨小测第一版前端演示。正式售卖版可继续接入订单校验、自动发货、一次性兑换码、结果存档、付费解锁完整报告。</div><button id="restartBtn" class="start" type="button">重新测试</button>`;document.getElementById('restartBtn').addEventListener('click',()=>location.reload());window.scrollTo({top:0,behavior:'smooth'})}
startBtn.addEventListener('click',startTest);els.prevBtn.addEventListener('click',prevQ);els.nextBtn.addEventListener('click',nextQ);
</script>
</body></html>
